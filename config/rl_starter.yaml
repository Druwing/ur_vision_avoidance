# Fixed-scene RL starter configuration.
# Augmented randomized domain (ARD) is intentionally disabled in this stage.
training:
  environment: fixed_scene
  total_timesteps: 100000
  seed: 7
  ard_enabled: false
  model_output: /tmp/ur_vision_avoidance_ppo

observation:
  topic: /rl/observation
  action_topic: /rl/action
  max_obstacle_distance_m: 3.0
  max_obstacle_speed_mps: 2.0
  sensor_timeout_s: 0.50

action:
  # Cartesian offset velocity in metres/second and radians/second.
  dimensions: 6
  max_linear_mps: 0.12
  max_angular_rps: 0.35
  control_period_s: 0.10

fixed_scene:
  # Nominal motion is +X toward the goal. The obstacle is fixed in front of it.
  goal_position_m: [1.20, 0.0, 0.45]
  obstacle_position_m: [0.65, 0.0, 0.45]
  obstacle_radius_m: 0.16
  start_position_m: [0.0, 0.0, 0.45]
  max_episode_steps: 160
  collision_distance_m: 0.22
  goal_tolerance_m: 0.08
  nominal_speed_mps: 0.08
  lateral_clearance_m: 0.32
